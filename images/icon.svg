<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">LLVM dragon avatar</title>
  <desc id="description">A friendly full-body LLVM-inspired dragon drawn in white on the original #317AC6 blue circle. Broad bat wings, swept-back horns, a gently curved neck, plated belly and little claws. One long, tapered tail sweeps toward the lower left, balancing the body on the right without any crossings. No lettering. The corners outside the circle are transparent.</desc>
